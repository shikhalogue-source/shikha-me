<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#f9efe7">
  <meta property="og:type" content="website">
  <meta property="og:title" content="shikha | creative director &amp; brand designer">
  <meta property="og:description" content="Calm, soulful, multi-sensory brand worlds: identity, imagery and story.">
  <meta property="og:image" content="/assets/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/century-gothic-regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/century-gothic-semibold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/century-gothic-black.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add('js');</script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "shikha",
    "jobTitle": "Creative Director & Brand Designer",
    "sameAs": ["https://www.linkedin.com/in/shikha-j/", "https://www.instagram.com/shikhalogue/"],
    "worksFor": { "@type": "Organization", "name": "Nirmano Creative Studio", "url": "https://nirmanocreativestudio.framer.website/" },
    "knowsAbout": ["Brand Identity", "Creative Direction", "Packaging Design", "Photography", "Film"]
  }
  </script>
</head>
<body data-page="home">
  <div class="grain" aria-hidden="true"></div>

  <!-- Loader -->
  <div class="loader" data-loader aria-hidden="true">
    <div class="loader__bg" data-loader-bg></div>
    <div class="loader__inner">
      <div class="loader__word" data-loader-word>shikha</div>
    </div>
    <div class="loader__bar"><div class="loader__progress" data-loader-progress></div></div>
  </div>

  <div data-chrome-top></div>

  <main id="top">
    <!-- HERO -->
    <section class="hero" data-theme-section="light" data-hero>
      <canvas class="hero__gl" data-hero-gl aria-hidden="true"></canvas>
      <div class="hero__center">
        <h1 class="hero__title" data-hero-title></h1>
        <p class="hero__text" data-hero-text></p>
      </div>
      <div class="hero__bottom container">
        <div class="hero__label-row">
          <span class="mono" data-hero-label></span>
          <span class="mono hero__scroll">(scroll)</span>
        </div>
        <div class="hero__divider" data-hero-divider></div>
        <div class="bigname" data-fit-name data-hero-name aria-hidden="true"></div>
      </div>
      <div class="shutter" data-shutter="cover" data-shutter-color="dark" data-rows="14" data-rows-mobile="8"></div>
    </section>

    <!-- STICKY STATEMENTS -->
    <section class="sticky section-dark" data-theme-section="dark" data-sticky-wrap>
      <div class="sticky__container">
        <div class="sticky__inner" data-sticky-inner></div>
      </div>
    </section>

    <!-- WORK -->
    <section class="work" id="work" data-theme-section="light">
      <div class="shutter shutter--top" data-shutter="reveal" data-shutter-color="dark" data-rows="14" data-rows-mobile="8"></div>
      <div class="container">
        <div class="label-row">
          <div class="label">Selected work</div>
          <div class="label-row__divider"></div>
        </div>
        <div class="work__list" data-work-list></div>
      </div>
    </section>

    <!-- OTHER PROJECTS -->
    <section class="others" id="other-projects" data-theme-section="light" data-others>
      <div class="container">
        <div class="label-row">
          <div class="label">Other projects</div>
          <div class="label-row__divider"></div>
        </div>
        <div class="others__list" data-others-list></div>
      </div>
      <div class="others__preview" data-others-preview aria-hidden="true"></div>
    </section>

    <!-- ABOUT -->
    <section class="about" id="about" data-theme-section="light">
      <div class="container">
        <div class="label-row">
          <div class="label">About</div>
          <div class="label-row__divider"></div>
        </div>
        <div class="about__grid">
          <figure class="about__portrait" data-about-portrait></figure>
          <div class="about__content">
            <p class="about__lead" data-highlight data-about-lead></p>
            <dl class="about__facts" data-about-facts></dl>
          </div>
        </div>
        <div class="about__photos" data-about-photos></div>
      </div>
      <div class="shutter shutter--bottom" data-shutter="cover" data-shutter-color="dark" data-rows="14" data-rows-mobile="8"></div>
    </section>

    <!-- SERVICES -->
    <section class="services section-dark" id="services" data-theme-section="dark">
      <div class="container services__grid">
        <div class="services__media" data-services-media></div>
        <div class="services__content">
          <div class="label label--light">What I can help with</div>
          <ol class="services__list" data-services-list></ol>
          <p class="services__detail" data-services-detail aria-live="polite"></p>
          <div class="services__note" data-services-note></div>
        </div>
      </div>
    </section>

    <!-- FAQ -->
    <section class="faq section-dark" data-theme-section="dark">
      <div class="container faq__grid">
        <div class="faq__title-wrap">
          <div class="label label--light">FAQ</div>
          <h2 class="faq__title" data-split="heading">The most common questions, answered.</h2>
        </div>
        <div class="faq__list" data-faq-list></div>
        <div class="faq__cta">
          <p class="faq__cta-text"><span>Have more questions?</span><span class="muted">Feel free to ask.</span></p>
          <button class="btn btn--light" data-modal-open type="button"><span class="btn__text" data-roll>Get in touch</span><svg class="btn__icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9L9 3M9 3H4M9 3V8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        </div>
      </div>
    </section>
  </main>

  <div data-chrome-bottom></div>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/vendor/SplitText.min.js"></script>
  <script src="js/vendor/lenis.min.js"></script>
  <script src="js/content.js"></script>
  <script src="js/gradient.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
